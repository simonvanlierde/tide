<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Tide</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f9f9"/>
      <stop offset="1" stop-color="#e4eef0"/>
    </linearGradient>
  </defs>

  <!-- Sea-mist ground (fills the whole canvas for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Cycle ring -->
  <circle cx="256" cy="256" r="155" fill="none" stroke="#2f8f8a" stroke-width="38"/>

  <!-- Coral droplet: the cycle carrying the body's own signal -->
  <path d="M256 188
           C306 250 312 282 312 300
           A56 56 0 1 1 200 300
           C200 282 206 250 256 188 Z"
        fill="#e26d5a"/>
</svg>
