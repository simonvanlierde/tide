<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Kept in sync with the resolved theme (see /theme.js and the provider),
         so it tracks the in-app toggle, not just the OS. -->
    <meta name="theme-color" content="#f5f9f9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tide" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Tide</title>
    <!-- biome-ignore lint/performance/noSyncScripts: it must set the theme before first paint -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript. To report a problem, email <a href="mailto:code@duinlab.nl">code@duinlab.nl</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>

</html>
