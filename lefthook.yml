# Fast checks on commit; unit tests on push. Full gate (coverage/build/bundle) lives in CI.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,mjs,ts,tsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
    test:
      run: pnpm test
