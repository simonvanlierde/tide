name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report a vulnerability as SECURITY.md says, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page where it happens, for example https://tide.duinlab.nl/settings.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What you tapped or typed, one step per line.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device & browser
      description: For example iPhone 15 with Safari 18, or Chrome 130 on Windows 11. Say if tide is installed to the home screen.
    validations:
      required: true
