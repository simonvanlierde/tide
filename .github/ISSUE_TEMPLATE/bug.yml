name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report a vulnerability as SECURITY.md says, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: environment
    attributes:
      label: Device & browser
      placeholder: e.g. iPhone 15, Safari 18 / Desktop Chrome 130
