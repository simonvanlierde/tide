allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAge: 4320 # minutes (3 days); blocks installing very fresh (often compromised) releases
overrides:
  serialize-javascript: ^7.0.5
  "@babel/core": ^7.29.6
  "@babel/plugin-transform-modules-systemjs": ^7.29.4
  # GHSA-qw65-cvwx-89v3 and six earlier fast-uri advisories, via workbox-build's ajv.
  # Remove once vite-plugin-pwa's workbox-build resolves fast-uri >= 3.1.7 on its own.
  fast-uri: ^3.1.7
  # GHSA-73wf-gq98-2v4g, via @babel/preset-env in workbox-build. Remove once the
  # lockfile resolves browserslist >= 4.28.7 without it.
  browserslist: ^4.28.7
  # GHSA-w5vr-8v7q-w6rv, via browserslist. Remove with the browserslist override.
  baseline-browser-mapping: ^2.11.0
  # GHSA-3jxr-9vmj-r5cp and GHSA-q2hr-2g5m-vwhr, via workbox-build's jake/minimatch 5.
  # Remove once vite-plugin-pwa no longer pulls minimatch 5.
  "brace-expansion@>=2 <3": ^2.1.7
  esbuild: ^0.28.1
