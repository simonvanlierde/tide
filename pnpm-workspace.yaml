# pnpm reads its project settings here, not from .npmrc. One package, so no
# `packages:` list.

# Resolve only releases at least three days old (in minutes): a compromised release
# is usually caught and yanked within that window. TODO: raise to a week (10080), as
# the template and Dependabot's cooldown have it, once every locked version is a week
# old (2026-10-23).
minimumReleaseAge: 4320
allowBuilds:
  esbuild: true
overrides:
  serialize-javascript: ^7.0.5
  "@babel/core": ^7.29.6
  "@babel/plugin-transform-modules-systemjs": ^7.29.4
  # GHSA-3jxr-9vmj-r5cp and GHSA-q2hr-2g5m-vwhr, via workbox-build's jake/minimatch 5.
  # Remove once vite-plugin-pwa no longer pulls minimatch 5.
  "brace-expansion@>=2 <3": ^2.1.7
  esbuild: ^0.28.1
